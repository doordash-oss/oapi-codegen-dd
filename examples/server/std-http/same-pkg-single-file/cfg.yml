# yaml-language-server: $schema=../../../../configuration-schema.json
package: api
output:
  directory: api
  use-single-file: true
error-mapping:
  CreateUserErrorResponse: message
  GetUserErrorResponse: message
  GetUserPostErrorResponse: message
  CreateOrderErrorResponse: message
  CreateOrderErrorResponseJSON: message
generate:
  handler:
    kind: std-http
    server:
      directory: server
      handler-package: github.com/doordash-oss/oapi-codegen-dd/v3/examples/server/std-http/same-pkg-single-file/api
