# yaml-language-server: $schema=../../../../configuration-schema.json
package: api
output:
  use-single-file: false
additional-imports:
  - package: "github.com/doordash-oss/oapi-codegen-dd/v3/examples/server/chi/other-pkg-mult-files/types"
generate:
  models: false
  handler:
    kind: chi
    models-package-alias: types
    validation:
      request: true
      response: true
    server:
      directory: srv
      port: 1234
      handler-package: github.com/doordash-oss/oapi-codegen-dd/v3/examples/server/chi/other-pkg-mult-files/api
