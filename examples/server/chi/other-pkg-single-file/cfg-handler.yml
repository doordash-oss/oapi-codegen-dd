# yaml-language-server: $schema=../../../../configuration-schema.json
package: api
output:
  use-single-file: true
  directory: api
additional-imports:
  - package: "github.com/doordash-oss/oapi-codegen-dd/v3/examples/server/chi/other-pkg-single-file/types"
generate:
  overwrite-scaffolded: true
  models: false
  handler:
    kind: chi
    models-package-alias: types
    validation:
      request: true
      response: true
    server:
      handler-package: github.com/doordash-oss/oapi-codegen-dd/v3/examples/server/chi/other-pkg-single-file/api
