# yaml-language-server: $schema=../../../../configuration-schema.json
package: api
output:
  use-single-file: false
error-mapping:
  CreateUserErrorResponse: message
  GetUserErrorResponse: message
generate:
  overwrite-scaffolded: true
  handler:
    kind: chi
    validation:
      request: true
      response: true
    server:
      handler-package: github.com/doordash-oss/oapi-codegen-dd/v3/examples/server/chi/same-pkg-mult-files/api
