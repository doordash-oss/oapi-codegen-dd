openapi: 3.1.0
info:
  version: '1.0'
  title: Webhook Events API
  description: >
    Example spec demonstrating webhook support.
    Defines inbound webhook callbacks for payment and order events.
webhooks:
  payment.authorized:
    post:
      summary: Payment has been authorized
      operationId: paymentAuthorized
      tags:
        - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentEvent'
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
  order.shipped:
    post:
      summary: Order has been shipped
      operationId: orderShipped
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderEvent'
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
  inventory.low:
    post:
      summary: Inventory level is low
      operationId: inventoryLow
      tags:
        - inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sku
                - remaining
              properties:
                sku:
                  type: string
                remaining:
                  type: integer
      responses:
        '200':
          description: Acknowledged
  internal.debug:
    post:
      summary: Internal debug event (excluded from generation)
      operationId: internalDebug
      tags:
        - internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebugEvent'
      responses:
        '200':
          description: Acknowledged
components:
  schemas:
    PaymentEvent:
      type: object
      required:
        - id
        - amount
        - currency
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Amount in minor units (e.g. cents)
        currency:
          type: string
          minLength: 3
          maxLength: 3
        metadata:
          $ref: '#/components/schemas/EventMetadata'
    OrderEvent:
      type: object
      required:
        - id
        - trackingNumber
      properties:
        id:
          type: string
          format: uuid
        trackingNumber:
          type: string
        carrier:
          type: string
        metadata:
          $ref: '#/components/schemas/EventMetadata'
    EventMetadata:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        source:
          type: string
    WebhookAck:
      type: object
      properties:
        received:
          type: boolean
    DebugEvent:
      type: object
      properties:
        level:
          type: string
        message:
          type: string
