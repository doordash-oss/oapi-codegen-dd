openapi: "3.0.0"
info:
  version: 1.0.0
  title: Pet store with contract tests
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 5
            maximum: 100
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "409":
          description: A pet with this name exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: No such pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted.
components:
  schemas:
    NewPet:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          example: Rex
        kind:
          type: string
          enum: [dog, cat]
        born:
          type: string
          format: date
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
