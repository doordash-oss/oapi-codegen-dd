openapi: 3.0.3
info:
  title: Document Upload API
  version: 1.0.0

paths:
  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Document stored synchronously
          headers:
            Location:
              schema:
                type: string
                format: uri
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStored'
        '202':
          description: Document queued for async processing
          headers:
            X-Request-Id:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentQueued'
        '422':
          description: Invalid document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: Service unavailable. Plain-text human-readable reason.
          content:
            text/plain:
              schema:
                type: string
  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDocument
      summary: Fetch a document
      responses:
        '200':
          description: Document found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStored'
        '404':
          description: No document with this ID. Takes precedence over 4XX.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '410':
          description: Document was deleted. No body, and still not a 4XX.
        '5XX':
          description: Any server error
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
        '4XX':
          description: Any other client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      operationId: deleteDocument
      summary: Delete a document
      responses:
        '204':
          description: Document deleted
        default:
          description: Any status not documented above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
  /health:
    get:
      operationId: getHealth
      summary: Report service health, whatever the status
      responses:
        default:
          description: Health report. Only a 2xx means healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  schemas:
    UploadRequest:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
        content:
          type: string
          format: byte
    DocumentStored:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
    DocumentQueued:
      type: object
      required: [job_id, estimated_completion_seconds]
      properties:
        job_id:
          type: string
          format: uuid
        estimated_completion_seconds:
          type: integer
    ValidationError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    NotFoundError:
      type: object
      required: [id]
      properties:
        id:
          type: string
    ServiceError:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
