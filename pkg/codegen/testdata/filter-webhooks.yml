openapi: 3.1.0
info:
  version: '1'
  title: Filter webhooks test
webhooks:
  order.created:
    post:
      summary: Order created
      operationId: orderCreated
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderEvent'
      responses:
        '200':
          description: OK
  payment.completed:
    post:
      summary: Payment completed
      operationId: paymentCompleted
      tags:
        - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentEvent'
      responses:
        '200':
          description: OK
components:
  schemas:
    OrderEvent:
      type: object
      properties:
        orderId:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
    PaymentEvent:
      type: object
      properties:
        paymentId:
          type: string
    Money:
      type: object
      properties:
        currency:
          type: string
        value:
          type: integer
